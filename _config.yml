title: "Oxymoron's Blog"
description: "Notes on calm building"
url: "https://oxymoron.blog"
baseurl: ""
permalink: /posts/:slug/
markdown: kramdown
theme: null

# i18n Configuration
default_lang: en
languages:
  - en
  - ko
  - ja

pagination:
  enabled: false

plugins:
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: /posts-feed.xml
  collections:
    articles:
      path: /feed.xml

collections:
  articles:
    output: true
    permalink: /posts/:path/
  books:
    output: true
    permalink: /books/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_articles"
      type: "articles"
    values:
      layout: post
      hidden: false
  - scope:
      path: "_books"
      type: "books"
    values:
      layout: book

# Files/dirs kept out of the built site.
# NOTE: setting `exclude` replaces Jekyll's defaults, so the standard
# entries are repeated here alongside our additions (docs, tooling, tests).
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docs
  - test
  - README.md
  - package.json
  - package-lock.json
  - tailwind.config.js
  - assets/css/tailwind.src.css

# Giscus Comments Configuration
# To enable comments:
# 1. Go to https://giscus.app
# 2. Enter your repo and configure settings
# 3. Copy the values below from the generated script
giscus:
  repo: ""                    # e.g., "username/repo"
  repo_id: ""                 # Copy from giscus.app
  category: "Announcements"   # Or your preferred category
  category_id: ""             # Copy from giscus.app
